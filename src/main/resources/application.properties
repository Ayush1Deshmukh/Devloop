# Port: free hosts inject $PORT (Render) or expect 7860 (Hugging Face Spaces).
server.port=${PORT:8080}

# Where the FastAPI engine lives.
#   docker-compose : http://devloop-api:8000  (default below)
#   deployed       : set DEVLOOP_ENGINE_URL to the public engine URL
devloop.engine.url=${DEVLOOP_ENGINE_URL:http://devloop-api:8000}
devloop.engine.timeout-seconds=${DEVLOOP_ENGINE_TIMEOUT:120}

# Keep startup quiet and fast on small free instances.
spring.main.banner-mode=off
